<!doctype html>
<html>
<head><meta charset="utf-8"><title>Snake</title>
<style>body{display:flex;height:100vh;align-items:center;justify-content:center;margin:0;background:#222}canvas{background:#000;image-rendering:pixelated}
    
</style>
</head>
<body>
<canvas id="s" width="400" height="400" ></canvas>
<script>
const canvas=document.getElementById('s'), ctx=canvas.getContext('2d');
let highScoreReached = false;
const tile=20, cols=canvas.width/tile, rows=canvas.height/tile;
let dir={x:0,y:1}, snake=[{x:5,y:8},{x:4,y:8},{x:3,y:8}], food={x:10,y:10}, gameOver=false, score=0;

document.addEventListener('keydown', e=>{
  if(e.key==='ArrowUp' && dir.y===0){dir={x:0,y:-1};}
  if(e.key==='ArrowDown' && dir.y===0){dir={x:0,y:1};}
  if(e.key==='ArrowLeft' && dir.x===0){dir={x:-1,y:0};}
  if(e.key==='ArrowRight' && dir.x===0){dir={x:1,y:0};}
  if(e.key===' ' && gameOver) restart();
});

function restart(){ snake=[{x:5,y:8},{x:4,y:8},{x:3,y:8}]; dir={x:1,y:0}; score=0; gameOver=false; placeFood(); }

function placeFood(){
  food.x = Math.floor(Math.random()*cols);
  food.y = Math.floor(Math.random()*rows);
  // ensure not on snake
  if(snake.some(s => s.x===food.x && s.y===food.y)) placeFood();
}

function update(){
  if(gameOver) return;
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
  // wrap around
  if(head.x < 0) head.x = cols-1;
  if(head.x >= cols) head.x = 0;
  if(head.y < 0) head.y = rows-1;
  if(head.y >= rows) head.y = 0;
  // collision with self
  if(snake.some(s => s.x===head.x && s.y===head.y)){ gameOver=true; return; }
  snake.unshift(head);
  // eat
  if(head.x === food.x && head.y === food.y){ score++; placeFood(); } else snake.pop();
}

function draw(){
  ctx.fillStyle='#000'; ctx.fillRect(0,0,canvas.width,canvas.height);
  // food
  ctx.fillStyle='#e33';
ctx.beginPath();
ctx.arc(food.x*tile + tile/2, food.y*tile + tile/2, tile/2 - 1, 0, Math.PI * 2);
ctx.fill();

  // snake
  ctx.fillStyle='#6f6';
for(const s of snake) {
    ctx.beginPath();
    ctx.arc(s.x*tile + tile/2, s.y*tile + tile/2, tile/2 - 1, 0, Math.PI * 2);
    ctx.fill();
}
ctx.fillStyle='#fff';
ctx.font='16px sans-serif';
ctx.fillText('Score: ' + score, 10, 20);

// Display High Score message when score >= 20
if(score >= 20 && !highScoreReached) {
    ctx.fillStyle = '#FFD700'; // gold color
    ctx.font = '22px sans-serif';
    ctx.fillText('🎉 High Score! 🎉', canvas.width / 2, 50);
    highScoreReached = true; // only show once
}

  ctx.fillStyle='#fff'; ctx.font='16px sans-serif'; ctx.fillText('Score: '+score, 10, 20);
  if(gameOver){
    ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.font='20px sans-serif';
    ctx.fillText('Game Over - Press Space to Restart', canvas.width/2, canvas.height/2);
  }
}

setInterval(()=>{ update(); draw(); }, 180);
</script>
</body>
</html>
